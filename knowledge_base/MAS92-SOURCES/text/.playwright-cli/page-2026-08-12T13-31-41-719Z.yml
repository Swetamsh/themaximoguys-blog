            - heading "IBM Maximo Application Suite Software Support Lifecycle Policy for Versions 9.0+" [level=1] [ref=e91]
            - article [ref=e94]:
              - generic [ref=e97]:
                - generic [ref=e102]:
                  - generic [ref=e103]: This document, all information contained herein, and IBM’s products and services are subject to change at any time with or without notice in IBM’s sole and absolute discretion. IBM Maximo Application Suite follows the IBM Standard Lifecycle Policy - Support Cycle-3.
                  - generic [ref=e105]:
                    - generic [ref=e106]:
                      - strong [ref=e107]: Overview
                      - text: Lifecycle policy Support Cycle-3 provides defect and non-defect product technical support for a period of at least three years from the date the product release was made generally available by IBM. Once a release announces a lifecycle transition, an option may exist to purchase
                      - link "Extended Support" [ref=e108] [cursor=pointer]:
                        - /url: https://www.ibm.com/support/pages/node/7008589
                      - text: and receive limited coverage for up to an additional 4 years. When an eligible product announces a lifecycle transition for the last version/release an option to purchase
                      - link "Sustained Support" [ref=e109] [cursor=pointer]:
                        - /url: https://www.ibm.com/support/pages/node/7008619
                      - text: may exist to provide limited coverage for up to an additional 5 years.
                    - generic [ref=e110]: Clients need to stay current with the installation of updates to obtain the latest product maintenance, security updates, and new features.
                    - generic [ref=e111]:
                      - text: For more information on IBM Support, see the
                      - link "IBM Support Guide" [ref=e112] [cursor=pointer]:
                        - /url: https://www.ibm.com/support/pages/node/733923
                      - text: .
                    - generic [ref=e113]:
                      - strong [ref=e114]: Versioning
                      - text: The numbering scheme for versions of IBM Maximo Application Suite is based on the principles of
                      - link "Semantic Versioning" [ref=e115] [cursor=pointer]:
                        - /url: https://semver.org
                      - text: (semver). However, the lifecycle follows the IBM standards for VRMF versioning where updates to the MINOR number will result in the resetting of the product lifecycle.
                    - generic [ref=e116]: "The version numbering takes the form major.minor.patch with: • MAJOR: Number changes may indicate incompatible changes between releases • MINOR: Number changes indicate a release with new functionality compatible with an earlier version • PATCH: Number changes for bug fixes and security updates compatible with an earlier version"
                    - generic [ref=e117]:
                      - strong [ref=e118]: Support Schedule for IBM Maximo Application Suite
                      - text: IBM Maximo Application Suite does not commit to a specific release schedule. Software lifecycle transition announcements for a version will be announced at least six months before it becomes effective. For more information about the lifecycle transition dates for IBM Maximo Application Suite releases, see the
                      - link "Supported Versions for Maximo Application Suite" [ref=e119] [cursor=pointer]:
                        - /url: https://www.ibm.com/support/pages/node/6963368
                      - text: .
                    - strong [ref=e121]: Bundled Open Source Software
                    - generic [ref=e122]:
                      - generic [ref=e123]:
                        - text: IBM Maximo Application Suite includes or bundles components derived from open source software and software from other IBM teams and Red Hat Inc. Support for such components is available through your usual IBM Support channels, with
                        - generic [ref=e124]:
