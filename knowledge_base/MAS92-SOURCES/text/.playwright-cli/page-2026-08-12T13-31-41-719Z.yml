                            - /url: https://www.ibm.com/support/pages/node/738883
                          - text: .
                        - text: If a defect is determined to be in any IBM or Red Hat product, your IBM Support representative works with the owning teams to resolve the defect and deliver a fix. For open source software/third party support information, see the
                        - generic [ref=e126]:
                          - link "IBM Open Source and Third party software policy " [ref=e127] [cursor=pointer]:
                            - /url: https://www.ibm.com/support/pages/node/737271
                          - text: .
                      - generic [ref=e128]:
                        - strong [ref=e129]: Bundled IBM and Red Hat software
                        - text: Individual versions or releases of the bundled products continue to follow their own individual upstream support lifecycles. Some bundled products, such as IBM Cloud Pak for Data and IBM Watson Discovery, follow different support lifecycles than IBM Maximo Application Suite. IBM ensures that a suitable upgrade path is available for customers of IBM Maximo Application Suite such that bundled products can continue to comply with their respective support lifecycles.
